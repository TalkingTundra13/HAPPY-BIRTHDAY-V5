<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puta♥</title>
    <link rel="shortcut icon" href="./icon.png" type="image/x-icon">
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
    <style>
        /* Estilos para el modal del video */
        #video-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        #video-modal.active {
            display: flex;
        }

        .video-container {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .video-container video {
            width: 100%;
            height: auto;
            max-height: 80vh;
        }

        .close-video {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0 10px;
        }

        .close-video:hover {
            color: #ff6b6b;
        }

        #video-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 100;
        }

        #video-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        #video-button:active {
            transform: translateY(-1px);
        }

        /* Estilos para el canvas de animación */
        #canva {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="drag-container">
        <div id="spin-container">
            <img src="./images/r1.png" alt="">
            <img src="./images/r2.png" alt="">
            <img src="./images/r3.png" alt="">
            <img src="./images/r4.png" alt="">
            <img src="./images/r5.jpg" alt="">
            <img src="./images/r6.png" alt="">
            <img src="./images/r7.png" alt="">
            <img src="./images/r8.png" alt="">
            <img src="./images/r9.png" alt="">
            <img src="./images/r10.png" alt="">
            <p style="">Feliz<span style=""> Cumpleaños</span> Wind</p>
            <button class="button" onclick="launchConfetti()"></button>
        </div>
        <div id="ground"></div>
    </div>

    <div id="music-container"></div>
    
    <!-- Botón para mostrar el video -->
    <button id="video-button" onclick="showVideo()">👀</button>

    <!-- Modal del video -->
    <div id="video-modal">
        <div class="video-container">
            <button class="close-video" onclick="closeVideo()">&times;</button>
            <video id="cameo-video" controls>
                <source src="./love/cameo.mp4" type="video/mp4">
                Tu navegador no soporta el elemento de video.
            </video>
        </div>
    </div>

    <div id="canva">
        <canvas id="canvas"></canvas>
    </div>

    <!-- Audio automático -->
    <!-- <audio id="myAudio" autoplay playsinline>
        <source src="music/setlove.mp3" type="audio/mpeg">
        <source src="music/setlove.ogg" type="audio/ogg">
    </audio> -->
    <script src='https://cdn.jsdelivr.net/npm/canvas-confetti@1/dist/confetti.browser.min.js'></script>
    <script src="main.js"></script>

    <script>
        // Función para el confetti
        function launchConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // Funciones para el video
        function showVideo() {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('cameo-video');
            modal.classList.add('active');
            video.play();
        }

        function closeVideo() {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('cameo-video');
            modal.classList.remove('active');
            video.pause();
            video.currentTime = 0;
        }

        // Cerrar el modal al hacer clic fuera del video
        document.getElementById('video-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeVideo();
            }
        });

        // Cerrar con la tecla ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeVideo();
            }
        });

        window.onload = function () {
            var audio = document.getElementById("myAudio");
            if (audio) {
                audio.muted = false;
                audio.play().catch(function (e) {
                    console.log('Audio playback failed:', e);
                });
            }

            // Efectos de fuegos artificiales y corazones
            const canvas = document.getElementById("canvas");
            if (canvas) {
                const ctx = canvas.getContext("2d");
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                function random(min, max) {
                    return Math.random() * (max - min) + min;
                }

                function Firework(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = random(2, 4);
                    this.color = `hsl(${random(0, 360)}, 100%, 50%)`;
                    this.vx = random(-3, 3);
                    this.vy = random(-3, 3);
                    this.life = 100;
                }

                Firework.prototype.draw = function () {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                };

                Firework.prototype.update = function () {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life--;
                };

                function Heart(x, y) {
                    this.x = x;
                    this.y = y;
                    this.size = random(20, 40);
                    this.color = 'red';
                    this.vy = random(-2, -1);
                    this.opacity = 1;
                }

                Heart.prototype.draw = function () {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.bezierCurveTo(this.x - this.size / 2, this.y - this.size / 2, this.x - this.size, this.y + this.size / 3, this.x, this.y + this.size);
                    ctx.bezierCurveTo(this.x + this.size, this.y + this.size / 3, this.x + this.size / 2, this.y - this.size / 2, this.x, this.y);
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = this.opacity;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                };

                Heart.prototype.update = function () {
                    this.y += this.vy;
                    this.opacity -= 0.01;
                };

                let fireworks = [];
                let hearts = [];

                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (Math.random() < 0.1) {
                        fireworks.push(new Firework(random(0, canvas.width), random(0, canvas.height)));
                    }
                    if (Math.random() < 0.05) {
                        hearts.push(new Heart(random(0, canvas.width), canvas.height));
                    }

                    fireworks.forEach((firework, index) => {
                        firework.draw();
                        firework.update();
                        if (firework.life <= 0) {
                            fireworks.splice(index, 1);
                        }
                    });

                    hearts.forEach((heart, index) => {
                        heart.draw();
                        heart.update();
                        if (heart.opacity <= 0) {
                            hearts.splice(index, 1);
                        }
                    });

                    requestAnimationFrame(animate);
                }
                animate();
            }
        };
    </script>
</body>

</html>
